name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Axiom certificate
        run: |
          set -o pipefail
          lake env lean scripts/AxiomCertificate.lean | tee axioms.out
          test -s axioms.out
          # 22 = current certificate entries (one line per `#print axioms`
          # command, regardless of wording); update when the certificate
          # grows. NOTE: `grep -c 'depends on axioms'` undercounts here —
          # a zero-axiom theorem (`regular_faithful`) prints "does not
          # depend on any axioms" instead, so line count is used.
          test "$(wc -l < axioms.out)" -eq 22
          python3 - <<'EOF'
          import re, sys
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          bad = False
          for line in open("axioms.out"):
              m = re.search(r"depends on axioms: \[(.*)\]", line)
              if m:
                  extra = {a.strip() for a in m.group(1).split(",")} - allowed
                  if extra:
                      print("DISALLOWED:", extra, "<-", line.strip())
                      bad = True
          sys.exit(1 if bad else 0)
          EOF
      - name: Install blueprint toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-extra graphviz libgraphviz-dev
          python3 -m pip install --upgrade pip
          python3 -m pip install -r blueprint/requirements.txt
      - name: Build blueprint web version
        run: |
          set -o pipefail
          leanblueprint web 2>&1 | tee web.log
          # plasTeX reports missing inputs as warnings, not failures
          ! grep -q "File not found" web.log
      - name: Check dependency graph is fully green
        run: |
          set -o pipefail
          # Definition-of-done #5 requires a fully green dependency graph.
          # Every node must be filled with one of the two "done" shades:
          # #B0ECA3 (definition, stated) or #1CAC78 (theorem/lemma, fully
          # proved). A statement with `\lean{}` but no `\leanok` leaves its
          # node unfilled (border goes can-state blue); a *proof* missing
          # `\leanok` leaves the statement border green but drops its own
          # fillcolor to can-prove blue (#A3D6FF) or proved-not-fully green
          # (#9CEC8B) instead, so border color alone can't catch it and this
          # checks fillcolor, requiring every node to have one.
          DOT=blueprint/web/dep_graph_document.html
          nodes=$(grep -oE 'shape=(box|ellipse)' "$DOT" | wc -l)
          filled=$(grep -oE 'fillcolor="#[0-9A-Fa-f]{6}"' "$DOT" | wc -l)
          echo "graph nodes: $nodes, filled: $filled"
          test "$nodes" -gt 0
          test "$nodes" -eq "$filled"
          ! grep -oE 'fillcolor="#[0-9A-Fa-f]{6}"' "$DOT" | grep -qvE '"#(B0ECA3|1CAC78)"'
      - name: Check blueprint declarations exist
        run: leanblueprint checkdecls
      - name: Upload blueprint web
        uses: actions/upload-artifact@v4
        with:
          name: blueprint-web
          path: blueprint/web

  blueprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-extra latexmk
      - name: Build blueprint PDF
        run: latexmk -pdf -interaction=nonstopmode print.tex
        working-directory: blueprint/src
      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: blueprint-pdf
          path: blueprint/src/print.pdf
